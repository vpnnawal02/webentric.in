<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Fonts (preconnected, non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"

  />

  <!-- Favicon -->

  <meta name="description"
    content="Webentric provides professional web design, website development, and web development services in Delhi. We build fast, modern, SEO-friendly websites for businesses and startups." />

    content="website development company in Delhi, web design services Delhi, website designer Delhi, website development services India, ecommerce website development Delhi, business website design India, landing page design Delhi, website cost India, website maintenance Delhi" />

  <meta name="author" content="Webentric" />

  <!-- Canonical -->
  <link rel="canonical" href="https://webentric.in/" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Theme -->
  <meta name="theme-color" content="#000000" />

  <!-- Pre-paint theme guard: apply saved theme before first render (no flash) -->
  <script>
    try {
      if (localStorage.getItem('webentric-theme') === 'light') {
        document.documentElement.classList.add('light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#fafafa');
      }
    } catch (e) {}
  </script>
